<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">Gauntlet causal loop</title><desc id="desc">An agent fails a task. Memory persists task-derived information, making the score appear to improve. Gauntlet catches the leak, retires the compromised holdout, and retests the claim on a fresh holdout.</desc><style>:root{color-scheme:light dark}.bg{fill:#0b1020}.card{fill:#121a2f;stroke:#52627f;stroke-width:2}.good,.warn{stroke-width:3}.warn{fill:#2a1b2a;stroke:#ff7294}.good{fill:#122820;stroke:#68d391}.line,.loop{fill:none;stroke:#94a3b8;stroke-width:4;marker-end:url(#arrow)}.loop{stroke:#68d391;stroke-dasharray:10 8;marker-end:url(#arrowGood)}text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#edf2f7}.kicker{fill:#94a3b8;font-size:24px;letter-spacing:2px}.label{font-size:30px;font-weight:700}.detail{fill:#cbd5e1;font-size:20px}.number{fill:#68d391;font-size:22px;font-weight:700}@media (prefers-color-scheme:light){.bg{fill:#f8fafc}.card{fill:#fff;stroke:#64748b}.warn{fill:#fff1f4}.good{fill:#edfff4}text{fill:#0f172a}.detail,.kicker{fill:#475569}}</style><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrowGood" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#68d391" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1600" height="900" class="bg" rx="28"/><text x="90" y="90" class="kicker">THE GAUNTLET INTEGRITY LOOP</text><text x="90" y="140" class="label">A higher score is not proof of a smarter agent.</text><path d="M 360 300 H 470" class="line"/><path d="M 780 300 H 890" class="line"/><path d="M 1200 300 H 1310" class="line"/><path d="M 1450 420 V 570 H 1100" class="line"/><path d="M 790 650 H 510" class="line"/><path d="M 330 650 H 160 V 780 H 1360 V 670" class="loop"/><g transform="translate(90 220)"><rect width="270" height="170" class="card" rx="16"/><text x="25" y="45" class="number">01</text><text x="25" y="90" class="label">Agent fails task</text><text x="25" y="125" class="detail">baseline verdict:</text><text x="25" y="150" class="detail">PROVISIONAL</text></g><g transform="translate(470 220)"><rect width="310" height="170" class="warn" rx="16"/><text x="25" y="45" class="number">02</text><text x="25" y="90" class="label">Memory persists</text><text x="25" y="125" class="detail">feedback, transcript,</text><text x="25" y="150" class="detail">or result artifact</text></g><g transform="translate(890 220)"><rect width="310" height="170" class="warn" rx="16"/><text x="25" y="45" class="number">03</text><text x="25" y="90" class="label">Score appears to improve</text><text x="25" y="125" class="detail">same task; seemingly</text><text x="25" y="150" class="detail">better result</text></g><g transform="translate(1310 220)"><rect width="220" height="170" class="good" rx="16"/><text x="25" y="45" class="number">04</text><text x="25" y="90" class="label">Leak caught</text><text x="25" y="125" class="detail">content-free</text><text x="25" y="150" class="detail">hash evidence</text></g><g transform="translate(790 570)"><rect width="310" height="170" class="good" rx="16"/><text x="25" y="45" class="number">05</text><text x="25" y="90" class="label">Retire compromised holdout</text><text x="25" y="125" class="detail">a leaked test is dead</text></g><g transform="translate(200 570)"><rect width="310" height="170" class="good" rx="16"/><text x="25" y="45" class="number">06</text><text x="25" y="90" class="label">Fresh holdout retests claim</text><text x="25" y="125" class="detail">same agents; clean test</text><text x="25" y="150" class="detail">real verdict</text></g></svg>